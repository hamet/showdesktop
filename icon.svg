<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3ff"/>
      <stop offset="0.5" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#4a9ff0"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="circle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f1fd"/>
    </linearGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#1f6fd6"/>
    </linearGradient>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1a4f8a" flood-opacity="0.3"/>
    </filter>
    <filter id="sqsh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f5fb0" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#outer)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="512" cy="512" r="270" fill="url(#circle)" filter="url(#soft)"/>
  <rect x="412" y="412" width="200" height="200" rx="28" fill="url(#sq)" filter="url(#sqsh)"/>
</svg>
